<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segura SOS — Desktop Mock Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { padding: 40px; }
        .mock-header {
            background: linear-gradient(135deg, #1f2d45, #080c14);
            border: 1px solid #4f8ef7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .mock-header h2 { margin: 0; color: #4f8ef7; }
        .mock-header p { margin: 5px 0 0; color: #94a3b8; font-size: 14px; }
        .desktop-badge {
            display: inline-block;
            background: #4f8ef7;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        

        <header>
            <div class="logo">
                <div class="logo-icon">🚨</div>
                <div>
                    <h1>Suraksha <span>SOS</span></h1>
                    <p class="logo-sub">Desktop Mock M1</p>
                </div>
            </div>
            <div id="connection-status" class="status-offline">Offline</div>
        </header>

        <div class="demo-banner">
            <div class="demo-banner-text">
                <strong>🎯Demo Mode</strong>
                <span>Click the button to instantly fire a severe crash event through the full pipeline → M2 → M3 → M4 map</span>
            </div>
            <button id="btn-demo" class="btn demo">🚨 Fire Demo SOS</button>
        </div>

        <main>
            <!-- Panel 2: CRASH SIMULATOR PANEL -->
            <section class="panel">
                <h2>Manual Crash Simulator</h2>

                <div class="control-group">
                    <label>Simulated Speed (km/h): <span id="lbl-speed">40</span></label>
                    <input type="range" id="sim-speed" min="0" max="150" value="40">
                </div>

                <div class="control-group">
                    <label>Simulated G-Force (g): <span id="lbl-g">1.0</span></label>
                    <input type="range" id="sim-g" min="0" max="5" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <label>Simulated Location</label>
                    <select id="sim-loc">
                        <option value="28.6139,77.2090">New Delhi (28.6139, 77.2090)</option>
                        <option value="19.0760,72.8777">Mumbai (19.076, 72.877)</option>
                        <option value="12.9716,77.5946">Bengaluru (12.971, 77.594)</option>
                        <option value="26.2183,78.1828" selected>Gwalior (26.218, 78.182)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Weather Condition</label>
                    <select id="sim-weather">
                        <option value="clear">Clear</option>
                        <option value="rain">Rain</option>
                        <option value="fog">Fog</option>
                    </select>
                </div>

                <div class="actions">
                    <button id="btn-normal" class="btn success">Normal Drive</button>
                    <button id="btn-hard-brake" class="btn warning">Hard Brake</button>
                    <button id="btn-crash" class="btn danger">Simulate Crash</button>
                </div>
            </section>

            <!-- Panel 3: M2 Analysis Result -->
            <section class="panel" id="analysis-panel" style="display:none;border-left:3px solid #ff3366">
                <h2>M2 Analysis Result</h2>
            </section>

            <!-- Panel 4: LIVE READOUT -->
            <section class="panel">
                <h2>Live Event Readout</h2>
                <div class="log-container" id="log-container">
                    <!-- Events will show up here -->
                </div>
            </section>
        </main>
    </div>

    <script src="mock_app.js"></script>
</body>
</html>
